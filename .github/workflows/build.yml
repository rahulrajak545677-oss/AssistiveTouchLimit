name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done
          find . -not -path './.git/*' -maxdepth 2 | head -30
      - name: Find project and build
        run: |
          FILE=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          cd "$DIR"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
